<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Catalog</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <style>
    body {
      background-color: #f8f9fa;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .product-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }

    .product-image {
      height: 180px;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <h1 class="text-center mb-4">Latest Products</h1>
    <p class="text-center text-muted mb-5">
      Responsive product grid using Bootstrap’s <code>.row</code> and <code>.col-md-3</code>.
    </p>

    <!-- Product Grid -->
    <div class="row g-4">
      <!-- Product 1 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x180" class="card-img-top product-image" alt="Product 1" />
          <div class="card-body text-center">
            <h5 class="card-title mb-2">Wireless Headphones</h5>
            <p class="fw-bold mb-3">₹2,499</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 2 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x180" class="card-img-top product-image" alt="Product 2" />
          <div class="card-body text-center">
            <h5 class="card-title mb-2">Smart Watch</h5>
            <p class="fw-bold mb-3">₹3,999</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 3 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x180" class="card-img-top product-image" alt="Product 3" />
          <div class="card-body text-center">
            <h5 class="card-title mb-2">Gaming Mouse</h5>
            <p class="fw-bold mb-3">₹1,299</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 4 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x180" class="card-img-top product-image" alt="Product 4" />
          <div class="card-body text-center">
            <h5 class="card-title mb-2">Bluetooth Speaker</h5>
            <p class="fw-bold mb-3">₹1,899</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 5 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x180" class="card-img-top product-image" alt="Product 5" />
          <div class="card-body text-center">
            <h5 class="card-title mb-2">Laptop Backpack</h5>
            <p class="fw-bold mb-3">₹999</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 6 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x180" class="card-img-top product-image" alt="Product 6" />
          <div class="card-body text-center">
            <h5 class="card-title mb-2">Mechanical Keyboard</h5>
            <p class="fw-bold mb-3">₹4,299</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 7 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x180" class="card-img-top product-image" alt="Product 7" />
          <div class="card-body text-center">
            <h5 class="card-title mb-2">USB-C Hub</h5>
            <p class="fw-bold mb-3">₹1,499</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Product 8 -->
      <div class="col-12 col-sm-6 col-md-3">
        <div class="card product-card shadow-sm h-100">
          <img src="https://via.placeholder.com/300x180" class="card-img-top product-image" alt="Product 8" />
          <div class="card-body text-center">
            <h5 class="card-title mb-2">Portable SSD</h5>
            <p class="fw-bold mb-3">₹5,999</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
