<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Loader</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(180deg,#0f1724,#0b1b2b);
  }

  .loader{
    display:flex;
    gap:12px;
  }

  .dot{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#7c5cff;
    animation:bounce 0.6s ease-in-out infinite;
  }

  .dot:nth-child(2){animation-delay:0.15s;}
  .dot:nth-child(3){animation-delay:0.3s;}

  @keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
  }
</style>
</head>
<body>
  <div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</body>
</html>
