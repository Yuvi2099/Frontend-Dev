<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f9fafc;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #222;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            z-index: 1000;
        }
        
        header h1 {
            font-size: 1.8rem;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 2em;
            font-size: 1rem;
            transition: color 0.3s;
        }
        
        nav a:hover {
            color: #f7c04a;
        }
        
        main {
            flex: 1;
            margin-top: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 5vh 10%;
        }
        
        main img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #555;
            margin-bottom: 1.5em;
        }
        
        main p {
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 600px;
            background-color: #e8eef5;
            padding: 1.5em;
            border-radius: 10px;
            color: #222;
        }
        
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 1em;
            font-size: 0.9rem;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>

    </header>
