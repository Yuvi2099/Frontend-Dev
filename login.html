<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q1 - Personalized Login Greeting</title>

  <!-- Inline CSS -->
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .card {
      background-color: #ffffff;
      padding: 20px 24px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      max-width: 360px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
      font-size: 0.95rem;
    }

    button {
      width: 100%;
      padding: 8px 10px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    #greetingMessage {
      margin-top: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Personalized Login Greeting</h1>

    <label for="userNameInput">Enter your name:</label>
    <input type="text" id="userNameInput" placeholder="e.g. Yuvraj" />

    <button id="greetBtn">Show Greeting</button>

    <p id="greetingMessage"></p>
  </div>

  <!-- Link to external JavaScript file -->
  <script src="login.js"></script>
</body>
</html>
