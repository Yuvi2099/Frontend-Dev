<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Typography Example</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(180deg,#0f1724,#0b1b2b);
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
  }

  section{
    max-width:800px;
    padding:40px;
    border-radius:12px;
    background:rgba(255,255,255,0.05);
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
  }

  h1{
    font-size:clamp(1.5rem, 4vw, 3rem);
    color:#7c5cff;
    margin-bottom:20px;
  }

  p{
    font-size:clamp(1rem, 2vw, 1.5rem);
    color:#e5e7eb;
    line-height:1.6;
  }

  @media(max-width:700px){
    section{
      padding:30px 20px;
    }
    p{
      line-height:1.8;
      letter-spacing:0.3px;
    }
  }
</style>
</head>
<body>
  <section>
    <h1>Responsive Typography with clamp()</h1>
    <p>
      Using the <code>clamp()</code> function in CSS allows your text to scale beautifully
      between a minimum, preferred, and maximum size — ensuring perfect readability
      across desktops, tablets, and mobile devices.
    </p>
  </section>
</body>
</html>
