<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filter Cards with Animation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(180deg,#0f1724,#0b1b2b);
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    animation:fadeIn 1.2s ease forwards;
  }

  @keyframes fadeIn {
    from {opacity:0; transform:translateY(20px);}
    to {opacity:1; transform:translateY(0);}
  }

  .container{
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:20px;
    flex-wrap:wrap;
    max-width:1000px;
    width:100%;
  }

  .card{
    background:#111827;
    border-radius:12px;
    padding:20px;
    width:300px;
    text-align:center;
    transition:transform 0.4s ease, box-shadow 0.4s ease;
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
  }

  .card:hover{
    transform:translateY(-10px);
    box-shadow:0 14px 35px rgba(124,92,255,0.3);
  }

  .card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:15px;
    filter:grayscale(100%);
    transition:filter 0.4s ease;
  }

  /* Apply different filters to each card */
  .card:nth-child(2) img{filter:sepia(100%);}
  .card:nth-child(3) img{filter:brightness(0.7);}

  .card:hover img{
    filter:none;
  }

  .card h2{
    color:#7c5cff;
    margin-bottom:8px;
  }

  .card p{
    color:#cbd5e1;
    font-size:0.95rem;
    line-height:1.4;
  }

  @media(max-width:800px){
    .container{
      flex-direction:column;
      align-items:center;
    }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="https://picsum.photos/id/1005/400/300" alt="Profile 1">
      <h2>Aria Sharma</h2>
      <p>Web Developer passionate about building fast and user-friendly experiences.</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1011/400/300" alt="Profile 2">
      <h2>Dev Patel</h2>
      <p>Creative Designer who loves crafting modern, clean, and engaging visuals.</p>
    </div>

    <div class="card">
      <img src="https://picsum.photos/id/1012/400/300" alt="Profile 3">
      <h2>Sofia Mehta</h2>
      <p>Content Strategist focused on impactful storytelling and brand voice.</p>
    </div>
  </div>
</body>
</html>
