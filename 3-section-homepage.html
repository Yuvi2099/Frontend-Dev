<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Homepage</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(180deg,#0f1724,#0b1b2b);
    color:#fff;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  header{
    background:#111827;
    padding:15px 0;
    display:flex;
    justify-content:space-around;
    align-items:center;
    font-weight:600;
  }

  header a{
    color:#e5e7eb;
    text-decoration:none;
    padding:8px 14px;
    border-radius:6px;
    transition:0.3s;
  }

  header a:hover{
    background:#374151;
    transform:scale(1.1);
  }

  main{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    padding:40px;
    flex-wrap:wrap;
  }

  .box{
    flex:1 1 250px;
    max-width:300px;
    min-height:160px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.2rem;
    font-weight:bold;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    transition:transform 0.3s;
  }

  .box:hover{
    transform:rotate(2deg) scale(1.05);
    background:rgba(124,92,255,0.15);
  }

  footer{
    background:#111827;
    text-align:center;
    padding:12px 0;
    font-size:0.9rem;
    color:#9ca3af;
    margin-top:auto;
  }

  @media(max-width:700px){
    main{flex-direction:column;}
  }
</style>
</head>
<body>
  <header>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </header>

  <main>
    <div class="box">Services</div>
    <div class="box">Projects</div>
    <div class="box">Contact</div>
  </main>

  <footer>
    &copy; 2025 Yuvraj — All rights reserved.
  </footer>
</body>
</html>
