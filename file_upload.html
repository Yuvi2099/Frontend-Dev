<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
</head>

<body>
    <h2>File Upload</h2>
    <p>Only .jpg or .png files are allowed.</p>
    <form>
        <input type="file" accept=".jpg, .png" required>
        <button type="submit">Upload</button>
    </form>
</body>

</html>
