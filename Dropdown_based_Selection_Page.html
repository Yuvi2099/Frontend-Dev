<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection Page</title>
</head>

<body>

    <h1>Travel Selection</h1>

    <form>
        <label for="country">Country:</label>
        <select id="country" name="country">
            <option value="india" selected>India</option>
            <option value="usa">USA</option>
            <option value="france">France</option>
            <option value="japan">Japan</option>
        </select>
        <br><br>

        <label for="state">State:</label>
        <select id="state" name="state">
            <option value="maharashtra" selected>Maharashtra</option>
            <option value="california">California</option>
            <option value="iledefrance">Île-de-France</option>
            <option value="kyoto">Kyoto</option>
        </select>
        <br><br>

        <label for="city">City:</label>
        <select id="city" name="city">
            <option value="mumbai" selected>Mumbai</option>
            <option value="losangeles">Los Angeles</option>
            <option value="paris">Paris</option>
            <option value="kyoto-city">Kyoto</option>
        </select>
        <br><br>

        <label for="place">Favorite Tourist Place:</label>
        <select id="place" name="place">
            <option value="gateway" selected>Gateway of India</option>
            <option value="hollywood">Hollywood Sign</option>
            <option value="eiffel">Eiffel Tower</option>
            <option value="kinkaku">Kinkaku-ji</option>
        </select>
    </form>

    <p>You have selected: India, Maharashtra, Mumbai, and your favorite tourist place is Gateway of India.</p>

</body>

</html>
