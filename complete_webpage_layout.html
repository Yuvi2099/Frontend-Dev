<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Webpage Layout</title>
    <style>
        /* General Reset */
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background: #f5f5f5;
        }
        /* Header */
        
        header {
            position: sticky;
            top: 0;
            background: rgba(0, 128, 128, 0.9);
            padding: 15px 30px;
            color: white;
            z-index: 100;
        }
        
        nav {
            display: flex;
            justify-content: space-around;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        nav a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        /* Hero Section */
        
        .hero {
            position: relative;
            background: url('https://picsum.photos/1920/600') center/cover no-repeat;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 0 20px;
        }
        
        .hero h1 {
            font-size: 3rem;
            text-shadow: 2px 2px rgba(0, 0, 0, 0.5);
        }
        /* About Section */
        
        .about {
            display: flex;
            flex-wrap: wrap;
            background: linear-gradient(to right, rgba(0, 128, 128, 0.05), rgba(0, 128, 128, 0.05));
            padding: 50px 20px;
            gap: 20px;
        }
        
        .about img {
            flex: 1 1 300px;
            max-width: 100%;
            border: 3px solid rgba(0, 128, 128, 0.3);
            border-radius: 10px;
        }
        
        .about-text {
            flex: 2 1 400px;
        }
        /* Services Section */
        
        .services {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            padding: 50px 20px;
            background-color: rgba(0, 128, 128, 0.05);
        }
        
        .service-box {
            flex: 1 1 250px;
            background: white;
            padding: 20px;
            border: 2px solid rgba(0, 128, 128, 0.2);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        /* Contact Section */
        
        .contact {
            padding: 50px 20px;
            background-color: rgba(0, 128, 128, 0.05);
            display: flex;
            justify-content: center;
        }
        
        .contact form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 400px;
        }
        
        .contact input,
        .contact textarea {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid rgba(0, 128, 128, 0.3);
            border-radius: 5px;
            outline: none;
            transition: border 0.3s;
        }
        
        .contact input:focus,
        .contact textarea:focus {
            border-color: rgba(0, 128, 128, 0.8);
        }
        
        .contact button {
            padding: 12px;
            background-color: teal;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .contact button:hover {
            background-color: rgba(0, 128, 128, 0.8);
        }
        /* Footer */
        
        footer {
            text-align: center;
            padding: 20px;
            background: rgba(0, 128, 128, 0.9);
            color: white;
        }
        /* Responsive */
        
        @media (max-width: 900px) {
            .about {
                flex-direction: column;
            }
            .services {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <a href="#hero">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero" id="hero">
        <h1>Welcome to Our Website</h1>
    </section>

    <section class="about" id="about">
