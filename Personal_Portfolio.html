<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
</head>
<body class="bg-light text-dark">

  <!-- Main Container -->
  <div class="container text-center p-5 mt-4">
    
    <!-- Header Section -->
    <h1 class="fw-bold">Yuvraj Singh</h1>
    <p class="lead text-muted mb-3">Aspiring Developer | Tech Enthusiast</p>

    <!-- Profile Image -->
    <img
      src="https://via.placeholder.com/150"
      alt="Profile"
      class="img-fluid rounded-circle mb-4"
      width="150"
      height="150"
    />

    <!-- Buttons Section -->
    <div class="mb-4">
      <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
      <a href="#" class="btn btn-outline-secondary">Download CV</a>
    </div>

    <!-- Contact Form Section -->
    <div class="mx-auto" style="max-width: 400px;">
      <h4 class="fw-bold mb-3">Contact Me</h4>
      <form>
        <input type="text" class="form-control mb-3" placeholder="Your Name" />
        <input type="email" class="form-control mb-3" placeholder="Your Email" />
        <textarea class="form-control mb-3" rows="3" placeholder="Message"></textarea>
        <button type="submit" class="btn btn-success w-100">Send Message</button>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
