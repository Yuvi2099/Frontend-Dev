<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <style>
    body {
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <!-- Header with task counter badge -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold">
        Task Tracker
        <span class="badge bg-primary">4 Pending</span>
      </h2>
      <button class="btn btn-success">
        Completed <span class="badge bg-light text-success">12</span>
      </button>
    </div>

    <!-- Task List -->
    <ul class="list-group shadow-sm">
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Finish Bootstrap assignment
        <span class="badge bg-danger rounded-pill">High</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Study DSA Tree Traversal
        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Update LinkedIn profile
        <span class="badge bg-success rounded-pill">Low</span>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center">
        Email mentor for review
        <span class="badge bg-danger rounded-pill">High</span>
      </li>
    </ul>
  </div>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
