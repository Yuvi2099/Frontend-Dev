<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Expense Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f8;
      display: flex;
      justify-content: center;
      margin: 0;
    }

    .container {
      background: #fff;
      padding: 20px 30px;
      margin-top: 50px;
      border-radius: 10px;
      width: 400px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    .input-section {
      display: grid;
      gap: 10px;
    }

    .input-section input {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .results p {
      background: #f0f4f7;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Monthly Expense Tracker</h1>

    <div class="input-section">
      <label for="food">Food:</label>
      <input type="number" id="food" placeholder="Enter food expense">
      
      <label for="travel">Travel:</label>
      <input type="number" id="travel" placeholder="Enter travel expense">

      <label for="rent">Rent:</label>
      <input type="number" id="rent" placeholder="Enter rent expense">

      <label for="bills">Bills:</label>
      <input type="number" id="bills" placeholder="Enter bills expense">

      <label for="leisure">Leisure:</label>
      <input type="number" id="leisure" placeholder="Enter leisure expense">

      <button onclick="calculateExpenses()">Calculate</button>
    </div>

    <div class="results">
      <p id="total">Total Expenses: ₹0.00</p>
      <p id="average">Average Expense: ₹0.00</p>
      <p id="final">Final Amount (with 10% Tax): ₹0.00</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
